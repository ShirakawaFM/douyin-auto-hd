name: ✨ 功能建议
description: 希望增加或改进的能力
title: "[Feature] "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        请先说明真实场景，而不是只写「优化一下」。项目定位是**最小权限**，需要新增浏览器权限的提议会被重点审查。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景 / 问题
      description: 现在哪里不方便？例如某个页面的画质识别不到
      placeholder: |
        在用户主页连续刷视频时，每次切换都会先闪一下低画质，然后才切回 1080P。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      placeholder: 希望在切换视频前就预选最高画质
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      render: text

  - type: dropdown
    id: permission-impact
    attributes:
      label: 是否需要新增浏览器权限？
      options:
        - 不需要（仅使用现有 storage / activeTab / douyin host 权限）
        - 可能需要（请在下方说明）
        - 不确定
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、控制台日志、相关 Issue 链接等
      render: text

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-label="抖音自动最高画质 · MIT © ShirakawaFM / 白川方明">
  <defs>
    <linearGradient id="fbg5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07070D"/>
      <stop offset="0.5" stop-color="#0C0A18"/>
      <stop offset="1" stop-color="#0A0712"/>
    </linearGradient>
    <linearGradient id="sig5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFD8E4"/>
      <stop offset="1" stop-color="#FF2E63"/>
    </linearGradient>
    <linearGradient id="hair5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E63" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF2E63" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shim5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFE3EC" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <clipPath id="waveClip"><rect x="0" y="0" width="130" height="34"/></clipPath>
  <rect width="1280" height="150" fill="url(#fbg5)"/>
  <rect x="0" y="0" width="1280" height="1.5" fill="url(#hair5)"/>

  <text x="64" y="86" fill="url(#sig5)" font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="46" font-style="italic">ShirakawaFM</text>
  <g opacity="0.75">
    <rect x="-120" y="50" width="120" height="46" fill="url(#shim5)">
      <animate attributeName="x" values="-120;520" dur="5.2s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="64" y="116" fill="#8C7C9B" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15">白川方明 · 只做一件小事：把「清晰度」这个下拉菜单去掉</text>

  <path d="M64 98 C160 108 300 92 420 100" fill="none" stroke="#FF2E63" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.35;0.9;0.35" dur="4s" repeatCount="indefinite"/>
  </path>

  <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#5E526F">
    <text x="64" y="140">MIT LICENSED · 2026 · 非官方项目</text>
    <text x="1216" y="140" text-anchor="end" fill="#8C5F72">github.com/ShirakawaFM/douyin-auto-hd</text>
  </g>

  <g transform="translate(790 58)" fill="none" stroke="#FF2E63" stroke-width="1.6" opacity="0.7">
    <rect x="0" y="0" width="130" height="34" rx="6"/>
    <g clip-path="url(#waveClip)">
      <path d="M2 17 l6 -6 l6 12 l6 -8 l6 10 l6 -6 l6 8 l6 -10 l6 12 l6 -8 l6 10 l6 -6 l6 8 l6 -10 l6 12 l6 -8 l6 10 l6 -6 l6 8 l6 -10 l6 10">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="96" y="21" fill="#FF9BB2" stroke="none" font-family="Consolas, monospace" font-size="11">4K</text>
  </g>
  <circle cx="1150" cy="75" r="3" fill="#22D3EE">
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>

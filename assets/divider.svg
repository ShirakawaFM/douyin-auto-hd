    <circle r="11" fill="#07070D" stroke="#FF2E63" stroke-width="1.2" opacity="0.9"/>
    <path d="M-3 -5 L7 0 L-3 5 Z" fill="#FF2E63"/>
    <circle r="16" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="12;20;12" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>

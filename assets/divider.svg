<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="34" viewBox="0 0 1280 34" role="img" aria-label="分隔线">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E63" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FF2E63" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E63" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFE3EC" stop-opacity="1"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="16" width="1280" height="1.5" fill="url(#dl)"/>
  <rect x="-170" y="15" width="170" height="3.5" fill="url(#dt)">
    <animate attributeName="x" values="-170;1280" dur="4.2s" repeatCount="indefinite"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Douyin Auto HD Chrome extension">
  <title>Douyin Web · Auto Highest Quality</title>
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070D"/>
      <stop offset="0.5" stop-color="#0C0A18"/>
      <stop offset="1" stop-color="#0A0712"/>
    </linearGradient>
    <radialGradient id="dglowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF2E63" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FF2E63" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dglowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dtitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFD8E4"/>
      <stop offset="1" stop-color="#FF2E63"/>
    </linearGradient>
    <linearGradient id="dbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6E93"/>
      <stop offset="0.5" stop-color="#FF2E63"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1030"/>
      <stop offset="0.5" stop-color="#241038"/>
      <stop offset="1" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8DF4FF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="playerClip">
      <rect x="806" y="86" width="404" height="228" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1280" height="420" fill="url(#dbg)"/>
  <circle cx="1010" cy="200" r="240" fill="url(#dglowP)"/>
  <circle cx="120" cy="360" r="220" fill="url(#dglowC)" opacity="0.7"/>

  <g stroke="#1A1830" stroke-width="1" opacity="0.75">
    <path d="M0 60 H1280"/><path d="M0 150 H1280"/><path d="M0 240 H1280"/><path d="M0 330 H1280"/>
  </g>

  <rect x="0" y="0" width="6" height="420" fill="url(#dbar)"/>
  <rect x="0" y="0" width="6" height="420" fill="#FFD8E4" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.55;0.1" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <text x="74" y="88" fill="#FF6E93" font-family="Consolas, 'Courier New', monospace" font-size="17" letter-spacing="4.5">MANIFEST V3 / CHROME &amp; EDGE</text>

  <text y="196" font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="66" font-weight="800" letter-spacing="-1">
    <tspan x="72" fill="url(#dtitle)">Douyin Auto HD</tspan>
  </text>

  <text x="74" y="246" fill="#F4E9F5" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700">Open a video — it starts at the best quality on offer</text>
  <text x="74" y="282" fill="#9487A8" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18">No more clicking the quality menu, and SPA switches won't drop it back</text>

  <g font-family="'Segoe UI', 'PingFang SC', sans-serif" font-size="15" font-weight="700">
    <g>
      <rect x="72" y="318" width="120" height="38" rx="19" fill="#1C1024" stroke="#7A2440"/>
      <text x="94" y="342" fill="#FFB3C6">4K → 2160P</text>
    </g>
    <g>
      <rect x="204" y="318" width="116" height="38" rx="19" fill="#1C1024" stroke="#7A2440"/>
      <text x="226" y="342" fill="#FFB3C6">2K → 1440P</text>
    </g>
    <g>
      <rect x="332" y="318" width="84" height="38" rx="19" fill="#1C1024" stroke="#7A2440"/>
      <text x="354" y="342" fill="#FFB3C6">1080P</text>
    </g>
    <g>
      <rect x="428" y="318" width="146" height="38" rx="19" fill="#101E2A" stroke="#1D5A6B"/>
      <text x="450" y="342" fill="#9AE6F2">Zero class names</text>
    </g>
    <g>
      <rect x="586" y="318" width="166" height="38" rx="19" fill="#101E2A" stroke="#1D5A6B"/>
      <text x="608" y="342" fill="#9AE6F2">Minimal permissions</text>
    </g>
  </g>

  <g>
    <rect x="806" y="86" width="404" height="228" rx="16" fill="#0B0918" stroke="#2A2140"/>
    <g clip-path="url(#playerClip)">
      <rect x="806" y="86" width="404" height="228" fill="url(#video)"/>
      <g opacity="0.5" stroke="#3A2A55" stroke-width="1">
        <path d="M806 150 H1210"/><path d="M806 214 H1210"/><path d="M900 86 V314"/><path d="M1010 86 V314"/><path d="M1120 86 V314"/>
      </g>
      <g fill="none" stroke="#22D3EE" stroke-width="1.4" opacity="0.55">
        <path d="M880 250 l26 -34 l30 46 l26 -30 l30 40 l26 -22 l32 34 l26 -40 l30 26"/>
        <path d="M880 270 l26 -18 l30 24 l26 -16 l30 22 l26 -14 l32 20" opacity="0.5"/>
      </g>
      <circle cx="1008" cy="196" r="30" fill="#FFFFFF" opacity="0.12"/>
      <path d="M1000 182 L1024 196 L1000 210 Z" fill="#FFFFFF" opacity="0.9"/>

      <rect x="806" y="86" width="404" height="3" fill="url(#scan)">
        <animate attributeName="y" values="86;311;86" dur="5s" repeatCount="indefinite"/>
      </rect>

      <g>
        <rect x="1046" y="102" width="146" height="86" rx="10" fill="#0A0812" fill-opacity="0.92" stroke="#3A2A55"/>
        <text x="1058" y="122" fill="#6E6383" font-family="'PingFang SC', sans-serif" font-size="11">Quality</text>
        <g font-family="'PingFang SC', sans-serif" font-size="13">
          <rect x="1054" y="128" width="130" height="22" rx="6" fill="#FF2E63" fill-opacity="0.18">
            <animate attributeName="fill-opacity" values="0.1;0.35;0.1" dur="2.2s" repeatCount="indefinite"/>
          </rect>
          <text x="1062" y="144" fill="#FF9BB2">4K Ultra HD ✓</text>
          <text x="1062" y="164" fill="#8C82A0">1080P</text>
          <text x="1062" y="182" fill="#6E6383">720P</text>
        </g>
      </g>

      <g>
        <rect x="906" y="278" width="220" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.2"/>
        <rect x="906" y="278" width="112" height="4" rx="2" fill="#FF2E63"/>
        <circle cx="1018" cy="280" r="5" fill="#FF2E63">
          <animate attributeName="cx" values="930;1122;930" dur="9s" repeatCount="indefinite"/>
        </circle>
        <text x="824" y="286" fill="#9A8FB0" font-family="Consolas, monospace" font-size="12">00:12</text>
        <text x="1146" y="286" fill="#9A8FB0" font-family="Consolas, monospace" font-size="12">04:38</text>
      </g>
    </g>

    <rect x="806" y="86" width="404" height="228" rx="16" fill="none" stroke="#FF2E63" stroke-opacity="0.4">
      <animate attributeName="stroke-opacity" values="0.15;0.6;0.15" dur="3.2s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(806 66)">
      <rect x="0" y="0" width="96" height="26" rx="13" fill="#22D3EE" fill-opacity="0.16" stroke="#22D3EE" stroke-opacity="0.5"/>
      <circle cx="16" cy="13" r="4" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" fill="#9AE6F2" font-family="Consolas, monospace" font-size="12">AUTO HD</text>
    </g>
  </g>

  <text x="74" y="394" fill="#5E526F" font-family="Consolas, 'Courier New', monospace" font-size="15">MIT · 只有 storage / activeTab / douyin.com · github.com/ShirakawaFM/douyin-auto-hd</text>
</svg>
